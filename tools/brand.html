<!doctype html>
<!-- Renders Habie's icon and launch screens. Used by tools/build-assets.js; open with
     ?w=512&h=512 (icon), &maskable for the safe-zone version, &splash for a launch screen. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Nunito; font-weight: 200 1000; src: url(../assets/fonts/nunito-latin.woff2) format("woff2"); }
html, body { margin: 0; }
body { width: var(--w); height: var(--h); overflow: hidden; display: grid; place-items: center; font-family: Nunito;
  background: radial-gradient(70% 70% at 25% 15%, #b39cf0 0%, transparent 60%), radial-gradient(60% 60% at 85% 90%, #ffd9a8 0%, transparent 60%), linear-gradient(150deg, #7f7ee0 0%, #5a5fd0 55%, #4c55c6 100%); }
.mark { position: relative; display: grid; place-items: center; }
.glow { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 68%); }
img { position: relative; filter: drop-shadow(0 calc(var(--s) * .05) calc(var(--s) * .06) rgba(40,30,110,.45)); }
.word { margin-top: calc(var(--s) * .14); color: #fff; font-weight: 900; font-size: calc(var(--s) * .34); letter-spacing: -.02em; text-align: center; }
.splash { display: flex; flex-direction: column; align-items: center; }
</style></head><body>
<div class="splash"><div class="mark"><span class="glow"></span><img src="../assets/3d/seedling.png" alt=""></div><div class="word" hidden>Habie</div></div>
<script>
  const q = new URLSearchParams(location.search), w = +q.get('w') || 512, h = +q.get('h') || w;
  const splash = q.has('splash'), maskable = q.has('maskable');
  const s = splash ? Math.min(w, h) * 0.28 : w * (maskable ? 0.52 : 0.68);
  document.body.style.setProperty('--w', w + 'px'); document.body.style.setProperty('--h', h + 'px'); document.body.style.setProperty('--s', s + 'px');
  const img = document.querySelector('img'), glow = document.querySelector('.glow');
  img.style.width = s + 'px'; glow.style.width = glow.style.height = s * 1.5 + 'px';
  if (splash) document.querySelector('.word').hidden = false;
</script>
</body></html>
